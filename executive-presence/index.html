<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Executive Presence — Practice Terminal</title>
<style>
  :root {
    --bg: #F3F7F5;
    --bg-raised: #FFFFFF;
    --ink: #1B222A;
    --ink-soft: #4E5860;
    --line: rgba(27, 34, 42, 0.12);
    --accent: #B96A1E;
    --accent-ink: #7A4614;
    --accent-soft: rgba(185, 106, 30, 0.12);
    --success: #2F7D68;
    --success-soft: rgba(47, 125, 104, 0.12);
    --error: #B0402E;
    --error-soft: rgba(176, 64, 46, 0.10);
    --shadow: 0 1px 2px rgba(27,34,42,0.04), 0 8px 24px rgba(27,34,42,0.06);
    --radius: 12px;

    --font-display: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161C;
      --bg-raised: #1A2029;
      --ink: #ECE7DC;
      --ink-soft: #9BA3AC;
      --line: rgba(236, 231, 220, 0.12);
      --accent: #D89654;
      --accent-ink: #F0C48F;
      --accent-soft: rgba(216, 150, 84, 0.16);
      --success: #63B39C;
      --success-soft: rgba(99, 179, 156, 0.14);
      --error: #E08670;
      --error-soft: rgba(224, 134, 112, 0.14);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161C;
    --bg-raised: #1A2029;
    --ink: #ECE7DC;
    --ink-soft: #9BA3AC;
    --line: rgba(236, 231, 220, 0.12);
    --accent: #D89654;
    --accent-ink: #F0C48F;
    --accent-soft: rgba(216, 150, 84, 0.16);
    --success: #63B39C;
    --success-soft: rgba(99, 179, 156, 0.14);
    --error: #E08670;
    --error-soft: rgba(224, 134, 112, 0.14);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.35);
  }
  :root[data-theme="light"] {
    --bg: #F3F7F5;
    --bg-raised: #FFFFFF;
    --ink: #1B222A;
    --ink-soft: #4E5860;
    --line: rgba(27, 34, 42, 0.12);
    --accent: #B96A1E;
    --accent-ink: #7A4614;
    --accent-soft: rgba(185, 106, 30, 0.12);
    --success: #2F7D68;
    --success-soft: rgba(47, 125, 104, 0.12);
    --error: #B0402E;
    --error-soft: rgba(176, 64, 46, 0.10);
    --shadow: 0 1px 2px rgba(27,34,42,0.04), 0 8px 24px rgba(27,34,42,0.06);
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); }

  .stage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 20px 80px;
    color: var(--ink);
    font-family: var(--font-body);
  }

  .frame {
    width: 100%;
    max-width: 640px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .chrome {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    font-family: var(--font-mono);
  }
  .chrome-path {
    font-size: 12.5px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chrome-path b { color: var(--ink); font-weight: 600; }
  .chrome-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hub-link {
    font-size: 12.5px;
    color: var(--ink-soft);
    text-decoration: none;
    white-space: nowrap;
    border-right: 1px solid var(--line);
    padding-right: 10px;
  }
  .hub-link:hover { color: var(--accent); }
  .streak {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 12.5px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .streak b {
    font-variant-numeric: tabular-nums;
    color: var(--accent-ink);
    font-size: 14px;
  }

  .progress-track {
    display: flex;
    gap: 4px;
    padding: 10px 20px;
    background: var(--bg);
  }
  .progress-seg {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
    transition: background 0.3s ease;
  }
  .progress-seg.done { background: var(--accent); }
  .progress-seg.current { background: var(--accent); opacity: 0.45; }

  .panel {
    padding: 32px 28px 28px;
    min-height: 360px;
    display: flex;
    flex-direction: column;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-ink);
    margin: 0 0 10px;
  }

  h1.step-title {
    font-family: var(--font-display);
    font-size: 26px;
    line-height: 1.25;
    font-weight: 500;
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0 0 14px;
    color: var(--ink);
  }

  .prose { font-size: 15.5px; line-height: 1.6; color: var(--ink); margin: 0 0 12px; }
  .prose:last-child { margin-bottom: 0; }
  .prose code { font-family: var(--font-mono); background: var(--accent-soft); padding: 0.05em 0.35em; border-radius: 4px; font-size: 0.9em; }

  .code-block {
    font-family: var(--font-mono);
    font-size: 14.5px;
    line-height: 1.7;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    margin: 14px 0;
    white-space: pre;
    overflow-x: auto;
    color: var(--ink);
  }
  .code-block .blank {
    display: inline-block;
    min-width: 2.4em;
    border-bottom: 2px solid var(--accent);
    color: var(--accent-ink);
    text-align: center;
  }
  .code-block .cmt { color: var(--ink-soft); }

  .prompt-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    margin-top: 14px;
  }
  .prompt-line .chevron { color: var(--accent); font-weight: 700; }
  .prompt-line input {
    flex: 1;
    font-family: var(--font-mono);
    font-size: 15px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    padding: 6px 2px;
    outline: none;
  }
  .prompt-line input:focus { border-bottom-color: var(--accent); }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: var(--accent);
    margin-left: 2px;
    animation: blink 1.1s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }

  .options { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .option {
    font-family: var(--font-mono);
    font-size: 14.5px;
    text-align: left;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg-raised);
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:hover { border-color: var(--accent); }
  .option:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .option .idx { color: var(--ink-soft); margin-right: 8px; }
  .option.correct { border-color: var(--success); background: var(--success-soft); }
  .option.wrong { border-color: var(--error); background: var(--error-soft); }
  .option.dim { opacity: 0.5; cursor: default; }

  .feedback {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.55;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: var(--success-soft); color: var(--success); }
  .feedback.no { background: var(--error-soft); color: var(--error); }
  .feedback b { color: var(--ink); }

  .score-box {
    display: flex; align-items: baseline; gap: 14px;
    padding: 16px 18px; margin-bottom: 16px;
    background: var(--accent-soft); border: 1px solid var(--line); border-radius: 8px;
  }
  .score-num {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: 28px; font-weight: 700; color: var(--accent-ink); line-height: 1;
  }
  .score-num .score-of { font-size: 16px; font-weight: 400; color: var(--ink-soft); }
  .score-msg { font-size: 14px; color: var(--ink-soft); }

  .recap-list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .recap-list li {
    font-size: 14.5px; line-height: 1.55;
    padding-left: 18px; position: relative; color: var(--ink);
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0; color: var(--accent);
    font-family: var(--font-mono);
  }

  .footer {
    margin-top: auto;
    padding-top: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .hint-btn {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--ink-soft);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    padding: 6px 0;
  }
  .hint-btn:hover { color: var(--ink); }
  .spacer { flex: 1; }

  .btn {
    font-family: var(--font-mono);
    font-size: 13.5px;
    letter-spacing: 0.01em;
    padding: 11px 20px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #FFFDF9;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .btn:hover { opacity: 0.92; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink-soft); border-color: var(--line); }
  .btn.ghost:hover { color: var(--ink); border-color: var(--ink-soft); }

  /* menu screen */
  .menu-list { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .menu-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg-raised);
    cursor: pointer;
    text-align: left;
  }
  .menu-item.locked { cursor: default; opacity: 0.5; }
  .menu-item:not(.locked):hover { border-color: var(--accent); }
  .menu-num {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent-ink);
    background: var(--accent-soft);
    border-radius: 6px;
    padding: 4px 7px;
    flex-shrink: 0;
  }
  .menu-text { flex: 1; }
  .menu-title { font-size: 15px; font-weight: 600; }
  .menu-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .menu-status { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-soft); }

  .intro-copy { font-size: 14.5px; line-height: 1.6; color: var(--ink-soft); margin-top: 4px; }

  .fade { animation: fadeIn 0.28s ease; }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="stage">
  <div class="frame">
    <div class="chrome">
      <div class="chrome-left">
        <a class="hub-link" href="../">‹ hub</a>
        <div class="chrome-path" id="chromePath">~/<b>executive-presence</b></div>
      </div>
      <div class="streak" id="streakBox">streak · <b id="streakNum">0</b>d</div>
    </div>
    <div class="progress-track" id="progressTrack"></div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
(function(){
  var STORAGE_KEY = 'execpresence_progress_v1';

  var lessons = [
    {
      id: 'labeling',
      title: 'Label the emotion in the room',
      sub: '8 steps · ~6 min',
      steps: [
        {
          type: 'info',
          eyebrow: 'Lesson 01 · Core principle',
          title: 'Name what they feel — out loud',
          body: [
            'Before you can lead a tense conversation, you have to prove you\'re not afraid of what\'s in the room. The fastest way to do that is to name the emotion you\'re sensing, out loud, as a plain observation.',
            'This is called a <strong>label</strong>. You\'re not agreeing. You\'re not comforting. You\'re showing them you can see clearly even when the temperature rises — and that alone changes how they treat you for the rest of the conversation.'
          ]
        },
        {
          type: 'info',
          eyebrow: 'Lesson 01 · Why it works',
          title: 'Naming an emotion drains its charge',
          body: [
            'Neuroscience calls this <strong>affect labeling</strong>: putting a feeling into words measurably lowers activity in the amygdala, the brain\'s alarm system. It calms the person feeling it — and it calms you, because doing it well forces you to stay observant instead of reactive.',
            'There\'s a second effect. Most people escalate a feeling because they don\'t feel seen. The moment someone names it accurately, the pressure to keep proving it drops. You\'ve just answered the unspoken question in the room — "does anyone notice what\'s happening to me?" — before they had to ask it out loud.'
          ]
        },
        {
          type: 'info',
          eyebrow: 'Lesson 01 · Say this',
          title: 'The exact wording that makes it land',
          body: [
            'Start with <strong>"It seems..."</strong>, <strong>"It sounds like..."</strong>, or <strong>"It looks like..."</strong> — never "I think" or "I feel." Those phrases keep the spotlight on them, not on your read of the situation, which is what makes the label land instead of sounding like a lecture.'
          ],
          code: '"It seems like you\'re frustrated with how this timeline came together."\n\n"It sounds like there\'s a real concern about resourcing here."\n\n"It looks like this decision is landing pretty hard on the team."\n\n"It seems like you don\'t feel your team\'s work is being valued."'
        },
        {
          type: 'info',
          eyebrow: 'Lesson 01 · Avoid this',
          title: 'The label-then-"but" trap',
          body: [
            'The fastest way to ruin a label is to attach a "but" to it: <em>"I hear that you\'re frustrated, but the deadline isn\'t moving."</em> The "but" cancels everything before it — the other person only hears the sentence after it, and now your label reads as a manipulation tactic, not an observation.',
            'Say the label. Stop talking. Let it sit there with nothing attached. If you need to make your own point, do it later, in a separate breath — never chained to the label with "but," "however," or "and yet."'
          ]
        },
        {
          type: 'info',
          eyebrow: 'Lesson 01 · Practice drill',
          title: 'Build the muscle in low-stakes reps',
          body: [
            'Don\'t debut this in your highest-pressure meeting. In your next three ordinary conversations today — a Slack thread, a coffee chat, a call with a vendor — find one moment to say <strong>"It seems like..."</strong> out loud, about something small. A little annoyance, a little excitement, anything real.',
            'You\'re not trying to solve anything in this drill. You\'re training your ear to notice emotion in real time, and your mouth to say it plainly, without hedging or over-explaining.'
          ]
        },
        {
          type: 'info',
          eyebrow: 'Lesson 01 · Roleplay',
          title: 'The stakeholder pushback',
          body: [
            'A stakeholder says, sharply, in a meeting: <em>"This roadmap doesn\'t make sense — you\'re deprioritizing the thing my team cares about most."</em>',
            'Your instinct is to defend the roadmap logic immediately. Instead, pause, and label what you\'re sensing before you explain anything. Read it out loud as if they were in front of you right now.'
          ],
          code: 'Try saying:\n\n"It sounds like this feels like your team\'s priorities got overlooked."\n\n— then stop talking. Let them respond before you explain the roadmap.'
        },
        {
          type: 'info',
          eyebrow: 'Lesson 01 · Feedback rubric',
          title: 'Grade yourself after the real conversation',
          body: [
            'Next time you use a label for real, check yourself against this:'
          ],
          code: '☐ Did I label instead of defending or explaining first?\n☐ Did I avoid attaching a "but" right after the label?\n☐ Did my tone stay flat and calm, not scripted or robotic?\n☐ Did their energy visibly drop after I said it?\n☐ Did I let a real silence follow, instead of filling it?'
        },
        {
          type: 'recap',
          eyebrow: 'Lesson 01 · Complete',
          title: 'What you\'ve got',
          bullets: [
            'A label is a plain, out-loud observation of someone\'s emotion — not agreement, not sympathy.',
            '"It seems / It sounds / It looks like..." keeps the focus on them, which is what makes it land.',
            'Never attach "but" to a label — it cancels the effect instantly.',
            'Naming an emotion measurably calms the nervous system — theirs and yours.'
          ],
          next: 'Next up: the power of the pause — why silence is where negotiating power actually lives.'
        }
      ]
    },
    {
      id: 'power-of-pause',
      title: 'The power of the pause',
      sub: '8 steps · ~6 min',
      steps: [
        {
          type: 'info',
          eyebrow: 'Lesson 02 · Core principle',
          title: 'Silence is not empty — it\'s where power lives',
          body: [
            'After you say something important — an ask, a boundary, a hard truth — the silence that follows isn\'t a gap you need to fill. It\'s the moment the other person actually has to sit with what you said. Whoever breaks that silence first is usually the one who gives something away.',
            'This isn\'t a trick. It\'s a discipline: staying still and quiet while every instinct in you wants to soften, explain, or apologize your way out of the discomfort.'
          ]
        },
        {
          type: 'info',
          eyebrow: 'Lesson 02 · Why it works',
          title: 'Discomfort with silence is a reflex, not a choice',
          body: [
            'Silence triggers the same low-grade anxiety as any unresolved social signal — your nervous system reads it as a threat and pushes you to act, usually by talking. Most people cave, over-explain, or lower their own ask purely to relieve that discomfort, not because the other side actually pushed back.',
            'The Stoics framed this exactly: <strong>you control your response, not the external moment.</strong> The pause is where you exercise that control on purpose, instead of letting a reflex spend it for you.'
          ]
        },
        {
          type: 'info',
          eyebrow: 'Lesson 02 · Say this',
          title: 'What to do instead of talking',
          body: [
            'The technique isn\'t a phrase — it\'s a countdown. State your position plainly, then silently count two full seconds before you allow yourself to speak again, no matter what expression crosses their face.'
          ],
          code: 'You: "I need two more weeks for this deliverable."\n\n[count: one-one-thousand, two-one-thousand]\n\n— say nothing else. Let them respond first.'
        },
        {
          type: 'info',
          eyebrow: 'Lesson 02 · Avoid this',
          title: 'Rescuing them from the silence',
          body: [
            'The most common failure is adding a softener the instant you finish your sentence — <em>"...if that\'s okay,"</em> <em>"...but I could try to make it work,"</em> or just nervous laughter. Every one of these hands back whatever ground you just gained, before the other person even had to respond.',
            'If the silence feels unbearable, that\'s the sign it\'s working — not a sign you did something wrong.'
          ]
        },
        {
          type: 'info',
          eyebrow: 'Lesson 02 · Practice drill',
          title: 'Count before you speak, on purpose',
          body: [
            'Pick one request you\'re going to make today — big or small. Say your sentence, then silently count "one-one-thousand, two-one-thousand, three-one-thousand" in your head before you say anything else, even if the other person is already talking.',
            'Do this once today in something low-stakes. The goal is to notice how long two or three seconds actually feels, so it stops feeling unbearable in a real negotiation.'
          ]
        },
        {
          type: 'info',
          eyebrow: 'Lesson 02 · Roleplay',
          title: 'The deadline conversation',
          body: [
            'You need to tell your manager the deliverable is going to take two more weeks than planned. Practice saying it plainly, then holding the silence — even if you imagine them looking unhappy or asking "why."'
          ],
          code: 'You: "I need two more weeks for this deliverable."\n\n[silence — do not add a reason yet]\n\nIf they ask "why," THEN explain — briefly, without apologizing for needing the time.'
        },
        {
          type: 'info',
          eyebrow: 'Lesson 02 · Feedback rubric',
          title: 'Grade yourself after the real conversation',
          body: [
            'Check yourself against this after you try it for real:'
          ],
          code: '☐ Did I state my position in one clean sentence, without hedging?\n☐ Did I stay silent for at least 2-3 seconds afterward?\n☐ Did I resist adding "if that\'s okay" or over-explaining?\n☐ Did my body stay still — no fidgeting, no nervous laugh?\n☐ Who spoke next — me, or them?'
        },
        {
          type: 'recap',
          eyebrow: 'Lesson 02 · Complete',
          title: 'What you\'ve got',
          bullets: [
            'The silence right after you speak is where negotiating power actually lives — don\'t rescue the other person from it.',
            'Discomfort with silence is a nervous-system reflex, not a rational signal that you did something wrong.',
            'Count two to three seconds in your head before speaking again, every time, until it stops feeling unbearable.',
            'If they speak first, you\'ve kept your position intact. If you speak first, you\'ve usually just given something back.'
          ],
          next: 'Next up: separating fact from story — how to stop reacting to the version of events you invented.'
        }
      ]
    },
    {
      id: 'facts-vs-story',
      title: 'Facts vs. story',
      sub: '8 steps · ~6 min',
      steps: [
        {
          type: 'info',
          eyebrow: 'Lesson 03 · Core principle',
          title: 'You\'re not reacting to what happened — you\'re reacting to your story about it',
          body: [
            'In almost every tense moment, the raw facts are neutral: an email wasn\'t sent, a meeting didn\'t include you, a deadline moved. What actually produces your anger or anxiety is the <strong>story</strong> you build on top of those facts — an interpretation about intent, competence, or respect that you invented, often in seconds.',
            'Separating the two — fact, then story — is how you get your composure back before you speak, and how you enter the conversation curious instead of already at war.'
          ]
        },
        {
          type: 'info',
          eyebrow: 'Lesson 03 · Why it works',
          title: 'Emotion follows the interpretation, not the event',
          body: [
            'Your body doesn\'t react to "I wasn\'t cc\'d on an email." It reacts to "he\'s trying to cut me out" — the story. That story is what spikes your heart rate, not the missing email itself. This is the same mechanism cognitive-behavioral approaches are built on: change the interpretation, and the physiological reaction changes with it.',
            'There\'s a second benefit. When you open a conversation with your <em>story</em> stated as if it were fact — "you excluded me on purpose" — the other person has to defend their intent before anything else can happen. Opening with the neutral fact instead keeps the door open for an actual explanation.'
          ]
        },
        {
          type: 'info',

  var state = load();
  if (!state.testScores) state.testScores = {};
  var view = { screen: 'menu', lessonId: null, stepIndex: 0, checked: false, firstTry: {} };

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { streak: 0, lastCompleteDate: null, completedLessons: {}, testScores: {} };
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  }
  function bumpStreak() {
    var today = todayStr();
    if (state.lastCompleteDate === today) return;
    var y = new Date(); y.setDate(y.getDate() - 1);
    var yesterday = y.getFullYear() + '-' + (y.getMonth()+1) + '-' + y.getDate();
    state.streak = (state.lastCompleteDate === yesterday) ? state.streak + 1 : 1;
    state.lastCompleteDate = today;
    save();
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderChrome() {
    document.getElementById('streakNum').textContent = state.streak;
    var path = view.screen === 'menu' ? '~/<b>executive-presence</b>'
      : '~/executive-presence/<b>' + view.lessonId + '</b>';
    document.getElementById('chromePath').innerHTML = path;
  }

  function renderProgress() {
    var track = document.getElementById('progressTrack');
    track.innerHTML = '';
    if (view.screen !== 'lesson') { track.style.display = 'none'; return; }
    track.style.display = 'flex';
    var lesson = lessons.filter(function(l){return l.id === view.lessonId;})[0];
    lesson.steps.forEach(function(_, i) {
      var seg = document.createElement('div');
      seg.className = 'progress-seg' + (i < view.stepIndex ? ' done' : i === view.stepIndex ? ' current' : '');
      track.appendChild(seg);
    });
  }

  function renderMenu() {
    var panel = document.getElementById('panel');
    var html = '';
    html += '<p class="eyebrow">Practice terminal</p>';
    html += '<h1 class="step-title">Calm, fierce, and clear under pressure</h1>';
    html += '<p class="intro-copy">Practical lessons on executive presence and high-stakes communication — labeling, silence, framing, and power, drawn from negotiation psychology, Stoicism, and hard-won leadership craft. Each lesson ends with a real drill and a roleplay, not a quiz.</p>';
    html += '<div class="menu-list">';
    lessons.forEach(function(l, i) {
      var done = state.completedLessons[l.id];
      var testScore = state.testScores[l.id];
      var statusLabel = l.locked ? l.sub
        : testScore ? (testScore.score + '/' + testScore.total)
        : done ? 'complete' : (l.sub || 'start');
      html += '<div class="menu-item' + (l.locked ? ' locked' : '') + '" data-lesson="' + l.id + '" tabindex="' + (l.locked ? '-1' : '0') + '">';
      html += '<div class="menu-num">' + String(i+1).padStart(2,'0') + '</div>';
      html += '<div class="menu-text"><div class="menu-title">' + esc(l.title) + '</div><div class="menu-sub">' + esc(l.locked ? l.sub : (l.sub || '')) + '</div></div>';
      html += '<div class="menu-status">' + esc(statusLabel) + '</div>';
      html += '</div>';
    });
    html += '</div>';
    panel.innerHTML = html;
    panel.className = 'panel fade';
    Array.prototype.forEach.call(panel.querySelectorAll('.menu-item:not(.locked)'), function(el) {
      el.addEventListener('click', function() { openLesson(el.getAttribute('data-lesson')); });
      el.addEventListener('keydown', function(e) { if (e.key === 'Enter') openLesson(el.getAttribute('data-lesson')); });
    });
  }

  function openLesson(id) {
    view.screen = 'lesson';
    view.lessonId = id;
    view.stepIndex = 0;
    view.checked = false;
    view.firstTry = {};
    renderAll();
  }

  function backToMenu() {
    view.screen = 'menu';
    view.lessonId = null;
    renderAll();
  }

  function currentLesson() {
    return lessons.filter(function(l){ return l.id === view.lessonId; })[0];
  }
  function currentStep() {
    return currentLesson().steps[view.stepIndex];
  }

  function renderStep() {
    var step = currentStep();
    var panel = document.getElementById('panel');
    var html = '<p class="eyebrow">' + esc(step.eyebrow) + '</p>';
    html += '<h1 class="step-title">' + esc(step.title) + '</h1>';

    if (step.type === 'info') {
      step.body.forEach(function(p){ html += '<p class="prose">' + p + '</p>'; });
      if (step.code) html += '<div class="code-block">' + esc(step.code) + '</div>';
      html += '<div class="footer"><div class="spacer"></div><button class="btn" id="primaryBtn">continue →</button></div>';
      panel.innerHTML = html;
      panel.className = 'panel fade';
      document.getElementById('primaryBtn').addEventListener('click', nextStep);
      return;
    }

    if (step.type === 'predict') {
      if (step.body) step.body.forEach(function(p){ html += '<p class="prose">' + p + '</p>'; });
      if (step.code) html += '<div class="code-block">' + esc(step.code) + '</div>';
      html += '<div class="options" id="optionsBox">';
      step.options.forEach(function(opt, i) {
        html += '<button class="option" data-idx="' + i + '"><span class="idx">' + (i+1) + '</span>' + esc(opt) + '</button>';
      });
      html += '</div>';
      html += '<div class="feedback" id="feedbackBox"></div>';
      html += '<div class="footer"><div class="spacer"></div><button class="btn" id="primaryBtn" disabled>continue →</button></div>';
      panel.innerHTML = html;
      panel.className = 'panel fade';
      wireChoice(step);
      return;
    }

    if (step.type === 'fill') {
      step.body.forEach(function(p){ html += '<p class="prose">' + p + '</p>'; });
      html += '<div class="code-block">' + esc(step.codeBefore) + '<span class="blank" id="blankPreview">___</span>' + esc(step.codeAfter) + '</div>';
      html += '<div class="prompt-line"><span class="chevron">&gt;&gt;&gt;</span><input id="fillInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here" /><span class="cursor"></span></div>';
      html += '<div class="feedback" id="feedbackBox"></div>';
      html += '<div class="footer"><button class="hint-btn" id="hintBtn">need a hint?</button><div class="spacer"></div><button class="btn" id="checkBtn">check</button></div>';
      panel.innerHTML = html;
      panel.className = 'panel fade';
      wireFill(step);
      return;
    }

    if (step.type === 'recap') {
      var lesson = currentLesson();
      var scoreResult = lesson.isTest ? computeScore(lesson) : null;
      if (scoreResult) {
        html += '<div class="score-box"><div class="score-num">' + scoreResult.score + '<span class="score-of">/' + scoreResult.total + '</span></div>'
          + '<div class="score-msg">' + esc(scoreResult.message) + '</div></div>';
      }
      if (step.code) html += '<div class="code-block">' + esc(step.code) + '</div>';
      html += '<ul class="recap-list">';
      step.bullets.forEach(function(b){ html += '<li>' + b + '</li>'; });
      html += '</ul>';
      html += '<p class="prose" style="margin-top:16px; color:var(--ink-soft);">' + esc(step.next) + '</p>';
      html += '<div class="footer"><button class="btn ghost" id="menuBtn">back to lessons</button><div class="spacer"></div></div>';
      panel.innerHTML = html;
      panel.className = 'panel fade';
      document.getElementById('menuBtn').addEventListener('click', function() {
        state.completedLessons[view.lessonId] = true;
        if (scoreResult) state.testScores[view.lessonId] = { score: scoreResult.score, total: scoreResult.total, date: todayStr() };
        bumpStreak();
        backToMenu();
      });
      return;
    }
  }

  function computeScore(lesson) {
    var total = 0, score = 0;
    lesson.steps.forEach(function(s, i) {
      if (s.type === 'predict' || s.type === 'fill') {
        total += 1;
        if (view.firstTry[i]) score += 1;
      }
    });
    var pct = total ? score / total : 0;
    var message = pct >= 0.9 ? 'Nailed it — that stuck.'
      : pct >= 0.7 ? 'Solid. A couple of spots to revisit.'
      : 'Good practice — worth another pass on the lessons above.';
    return { score: score, total: total, message: message };
  }

  function wireChoice(step) {
    var box = document.getElementById('optionsBox');
    var fb = document.getElementById('feedbackBox');
    var primary = document.getElementById('primaryBtn');
    var answered = false;
    primary.addEventListener('click', nextStep);
    Array.prototype.forEach.call(box.querySelectorAll('.option'), function(btn) {
      btn.addEventListener('click', function() {
        if (answered) return;
        answered = true;
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        view.firstTry[view.stepIndex] = (idx === step.answer);
        Array.prototype.forEach.call(box.querySelectorAll('.option'), function(b, i) {
          if (i === step.answer) b.classList.add('correct');
          else if (b === btn) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        fb.className = 'feedback show ' + (idx === step.answer ? 'ok' : 'no');
        fb.innerHTML = (idx === step.answer ? '<b>Correct.</b> ' : '<b>Not quite.</b> ') + step.explanation;
        primary.disabled = false;
      });
    });
  }

  function wireFill(step) {
    var input = document.getElementById('fillInput');
    var fb = document.getElementById('feedbackBox');
    var checkBtn = document.getElementById('checkBtn');
    var hintBtn = document.getElementById('hintBtn');
    var solved = false;

    function doCheck() {
      if (solved) { nextStep(); return; }
      var val = input.value.trim().toLowerCase();
      var ok = step.answer.some(function(a){ return a.toLowerCase() === val; });
      if (!(view.stepIndex in view.firstTry)) view.firstTry[view.stepIndex] = ok;
      fb.className = 'feedback show ' + (ok ? 'ok' : 'no');
      fb.innerHTML = (ok ? '<b>Correct.</b> ' : '<b>Not quite.</b> ') + step.explanation;
      if (ok) {
        solved = true;
        document.getElementById('blankPreview').textContent = step.answer[0];
        input.disabled = true;
        checkBtn.textContent = 'continue →';
      }
    }
    checkBtn.addEventListener('click', doCheck);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') doCheck(); });
    hintBtn.addEventListener('click', function() {
      fb.className = 'feedback show ok';
      fb.innerHTML = '<b>Hint.</b> ' + step.hint;
    });
  }

  function nextStep() {
    var lesson = currentLesson();
    if (view.stepIndex < lesson.steps.length - 1) {
      view.stepIndex += 1;
      renderAll();
    }
  }

  function renderAll() {
    renderChrome();
    renderProgress();
    if (view.screen === 'menu') renderMenu();
    else renderStep();
  }

  renderAll();
})();
</script>
</body>
</html>
